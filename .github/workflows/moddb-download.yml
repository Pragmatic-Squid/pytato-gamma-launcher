name: Download ECS-SLX from ModDB

on:
  push:
    paths:
      - ".github/workflows/moddb-download.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install downloader dependencies
        run: python -m pip install requests beautifulsoup4 lxml tqdm

      - name: Download ECS-SLX via project ModDB downloader
        run: |
          mkdir -p downloads
          python - <<'PY'
          import sys
          from pathlib import Path
          import requests

          sys.path.insert(0, str(Path("pytato_gamma_launcher/downloader").resolve()))
          from moddb import download

          url = "https://www.moddb.com/downloads/start/295739"
          with requests.Session() as session:
              filename = download(session, url, Path("downloads"))

          if not filename:
              raise SystemExit("ModDB downloader did not produce a file.")

          output = Path("downloads") / filename
          if not output.is_file() or output.stat().st_size == 0:
              raise SystemExit(f"Downloaded file is missing or empty: {output}")

          print(f"SUCCESS: {output} ({output.stat().st_size} bytes)")
          PY

      - name: Upload ECS-SLX archive
        uses: actions/upload-artifact@v4
        with:
          name: ECS_SLX
          path: downloads/*
          if-no-files-found: error
          retention-days: 14
